<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9D3C6"/><stop offset="1" stop-color="#B9B09E"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A89E8A"/><stop offset="1" stop-color="#8A806D"/></linearGradient>
 <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
 <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".45"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
 <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6E3" stop-opacity=".9"/><stop offset="1" stop-color="#FFF6E3" stop-opacity="0"/></radialGradient>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="blur2"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#wall)"/>
<!-- пол -->
<polygon points="0,760 1600,760 1600,1000 0,1000" fill="url(#floor)"/>
<line x1="0" y1="760" x2="1600" y2="760" stroke="#FFFFFF" stroke-opacity="0.25"/>
<!-- ореол окна -->
<ellipse cx="930" cy="430" rx="420" ry="380" fill="url(#halo)"/>
<!-- окно с арочным верхом -->
<path d="M790,760 L790,260 A140,140 0 0 1 1070,260 L1070,760 Z" fill="#FFFFFF" fill-opacity="0.95" filter="url(#blur2)"/>
<g stroke="#7A7062" stroke-width="6" opacity=".55">
 <line x1="930" y1="130" x2="930" y2="760"/><line x1="790" y1="420" x2="1070" y2="420"/><line x1="790" y1="590" x2="1070" y2="590"/>
</g>
<!-- световой луч на полу -->
<polygon points="790,760 1070,760 1260,1000 560,1000" fill="url(#beam)"/>
<!-- пилон слева -->
<rect x="300" y="0" width="120" height="760" fill="#7A7062" opacity=".7"/>
<rect x="300" y="0" width="4" height="760" fill="#FFFFFF" opacity="0.25"/>
<!-- подвесной светильник -->
<line x1="560" y1="0" x2="560" y2="380" stroke="#FFFFFF" stroke-opacity=".3" stroke-width="2"/>
<circle cx="560" cy="400" r="90" fill="url(#lamp)" filter="url(#soft)"/>
<path d="M520,392 A40,30 0 0 1 600,392 Z" fill="#5F574B"/>
<!-- диван -->
<g filter="url(#blur2)">
 <rect x="470" y="700" width="560" height="120" rx="40" fill="#5F574B"/>
 <rect x="440" y="640" width="620" height="110" rx="46" fill="#7A7062"/>
 <rect x="500" y="760" width="500" height="30" rx="12" fill="#5F574B" opacity=".8"/>
</g>
<ellipse cx="750" cy="850" rx="360" ry="26" fill="#000" opacity=".25" filter="url(#soft)"/>
<!-- приставной столик и ваза -->
<rect x="1130" y="700" width="140" height="110" rx="70" fill="#5F574B" filter="url(#blur2)"/>
<path d="M1185,700 C1170,650 1175,610 1200,590 C1225,610 1230,650 1215,700 Z" fill="#7A7062"/>
<!-- кресло справа -->
<rect x="1360" y="640" width="200" height="190" rx="60" fill="#7A7062" filter="url(#blur2)"/>
</svg>